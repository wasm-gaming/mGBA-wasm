<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mGBA WASM — Game Boy Advance Demo</title>
    <link rel="icon" href="data:," />

    <!-- Base theme from the engine-specs demo template, then our GBA skin.
         mgba.css is loaded last so its :root token overrides win. -->
    <link rel="stylesheet" href="./demo.css" />
    <link rel="stylesheet" href="./mgba.css" />
  </head>
  <body>
    <main></main>

    <script type="module">
      import demo from './demo.js'
      import sdk, { manifest } from './mgba/mgba.sdk.js'
      import { toEscMenuGroups } from './mgba/mgba.options.js'

      // Engine options worth trying without editing code, as page query params:
      // ?system=gb, ?aspect=4:3, ?interframeBlending=true, ?idleOptimization=ignore, ...
      const params = new URLSearchParams(location.search)
      const BOOLEAN_KEYS = [
        'interframeBlending',
        'skipBios',
        'allowOpposingDirections',
        'gamepads',
        'escMenu',
      ]
      const NUMBER_KEYS = ['volume']
      const overrides = {}
      for (const key of [
        'system',
        'gbModel',
        'idleOptimization',
        'renderFilter',
        'aspect',
        'logLevel',
        ...BOOLEAN_KEYS,
        ...NUMBER_KEYS,
      ]) {
        const value = params.get(key)
        if (value === null) continue
        if (BOOLEAN_KEYS.includes(key)) overrides[key] = value !== 'false'
        else if (NUMBER_KEYS.includes(key)) overrides[key] = Number(value)
        else overrides[key] = value
      }

      // The shell captures this array once and mutates each row's `value` as
      // the player changes it, so the same reference is reused below to seed it
      // with what the engine actually booted with.
      const optionGroups = toEscMenuGroups()

      let engine = null

      // Files are tracked here rather than read back through demo.hasFile() /
      // demo.loadToMEMFS(). In engine-specs 0.2.5 the shell's own save handlers
      // receive the CustomEvent that jq79's programmatic `.on()` delivers and
      // store it as if it were the File — every `extractFile` inside the
      // components unwraps `.detail`, but demo.js's handleSaveRom/handleSaveBios
      // do not — so its copy of the ROM is an Event and loadToMEMFS yields
      // nothing. Unwrapping it here costs four lines and keeps the demo working
      // against the published shell.
      const files = { rom: null, bios: null }
      const unwrap = (value) =>
        value instanceof File ? value : value?.detail instanceof File ? value.detail : null

      demo
        .init({
          manifest,
          messages: {
            title: 'mGBA WASM — Game Boy Advance Demo',
            dropRomPrompt: 'Drop a .gba / .gb / .gbc ROM',
            launchButton: 'Launch',
            escMenuTitle: 'mGBA Settings',
          },
          // mGBA's high-level BIOS runs virtually everything, so a BIOS image
          // is offered rather than demanded.
          bios: 'optional',
          escMenu: {
            enabled: true,
            optionGroups,
            onOptionChange(key, value) {
              engine?.config.write(key, value)
            },
            onRestoreDefaults() {
              engine?.config.restoreDefaults()
              syncMenu()
            },
          },
        })
        .on('rom:save', (payload) => {
          files.rom = unwrap(payload?.file)
        })
        .on('rom:remove', () => {
          files.rom = null
        })
        .on('bios:save', (payload) => {
          files.bios = unwrap(payload?.file)
        })
        .on('bios:remove', () => {
          files.bios = null
        })
        .on('launch', async (e) => {
          if (!files.rom) throw new Error('No ROM selected')

          const assets = { rom: new Uint8Array(await files.rom.arrayBuffer()) }
          if (files.bios) assets.bios = new Uint8Array(await files.bios.arrayBuffer())

          engine = await sdk.load({
            attachTo: e.attachTo,
            assets,
            options: overrides,
            persist: 'opfs',
            // Per-game SRAM and per-game menu tweaks, keyed by the file the
            // player dropped.
            storageNamespace: files.rom.name.replace(/\.[^.]+$/, ''),
            onEvent(event) {
              if (event.type === 'error') console.error(event.error)
            },
          })

          syncMenu()
          engine.start()
          return engine
        })

      /** Copies the engine's live values into the rows the shell is holding. */
      function syncMenu() {
        if (!engine) return
        const current = engine.escMenuGroups()
        for (const group of optionGroups) {
          const fresh = current.find((g) => g.id === group.id)
          for (const option of group.options) {
            const match = fresh?.options.find((o) => o.key === option.key)
            if (match) option.value = match.value
          }
        }
      }
    </script>
  </body>
</html>
